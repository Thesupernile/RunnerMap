<!DOCTYPE HTML>
<html>
    <head>
        <!-- Import leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    
        <link rel="stylesheet" href="index.css">
        <title>Runner Map</title>
    </head>
    <body>
        <div id="map"></div>
        <div id="sideBar" class="sideBar">
            <h1>Runner Map V0.1.1</h1>
            <br>
            <p>Route Distance:  XXXkm</p>
            <p>Destinations Required:  XXX</p>
            <p>Approximate Time To Run: XXXhrs XXXmins XXXsecs</p>
            <p>Length Of Route Wanted: <input></input></p>
            <p>Round Trip? <input type="checkbox"></input></p>
            <br>
            <br>
            <button>Calculate Route</button>
            <p id="ErrorFeedback" style="color: red;"></p>
            <button onclick="clearPoints()">Clear Points</button>

        </div>

        <script src="index.js"></script>
    </body>
</html>
