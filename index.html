<!DOCTYPE HTML>
<html>
    <head>
        <!-- Import leaflet -->
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    
        <link rel="stylesheet" href="index.css">
        <title>Runner Map</title>
    </head>
    <body>
        <div id="map"></div>
        <div id="sideBar" class="sideBar">
            <h1>Runner Map V1.0.0</h1>
            <br>
            <p>Route Distance:  XXXkm</p>
            <p>Destinations Required:  XXX</p>
            <p>Approximate Time To Run: XXXhrs XXXmins XXXsecs</p>
            <p>Length Of Route Wanted: <input></input></p>
            <br>
            <br>
            <button>Calculate Route</button>

        </div>

        <script>

        var testRouteCoords = [];
        var map = L.map('map').setView({lon: 0.13488678725880782, lat: 52.18808662172259}, 19);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
        }).addTo(map);

        var testRoute = L.polyline(testRouteCoords).addTo(map);

        function onMapClick(e) {
            testRouteCoords.push(e.latlng); 
            testRoute = L.polyline(testRouteCoords).addTo(map);
            L.marker(e.latlng).addTo(map);
        }   

        map.on('click', onMapClick);


        </script>
    </body>
</html>
